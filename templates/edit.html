<!DOCTYPE html>
<html>

<head>

    <title>Edit Record</title>

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">

</head>


<body>


<div class="container mt-5">

    <div class="card shadow p-4">

        <h1 class="text-center">
            Edit Record
        </h1>

        <p class="text-center text-muted">
            Update the record information
        </p>


        {% if message %}

        <div class="alert alert-danger">

            {{ message }}

        </div>

        {% endif %}


        <form method="POST">


            <div class="mb-3">

                <label class="form-label">
                    Name
                </label>

                <input
                    type="text"
                    name="name"
                    class="form-control"
                    value="{{ record['name'] }}"
                    required>

            </div>


            <div class="mb-3">

                <label class="form-label">
                    Email
                </label>

                <input
                    type="email"
                    name="email"
                    class="form-control"
                    value="{{ record['email'] }}"
                    required>

            </div>


            <button
                type="submit"
                class="btn btn-primary">

                Update Record

            </button>


            <a
                href="/records"
                class="btn btn-secondary">

                Cancel

            </a>


        </form>

    </div>

</div>


</body>

</html>
