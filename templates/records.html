<!DOCTYPE html>
<html>

<head>

    <title>Stored Records</title>

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">

</head>

<body>

<div class="container mt-5">

    <h1 class="text-center">
        Stored Records
    </h1>


    <!-- Search -->

    <form method="GET" action="/records" class="mt-4">

        <div class="input-group">

            <input
                type="text"
                name="search"
                class="form-control"
                placeholder="Search by name or email..."
                value="{{ search }}"
            >

            <button
                type="submit"
                class="btn btn-primary">

                Search

            </button>

        </div>

    </form>


    <!-- Records -->

    {% if data %}

    <table class="table table-bordered table-striped mt-4">

        <thead class="table-dark">

            <tr>

                <th>ID</th>

                <th>Name</th>

                <th>Email</th>

                <th>Action</th>

            </tr>

        </thead>


        <tbody>

            {% for record in data %}

 <tr>

    <td>
        {{ record["id"] }}
    </td>

    <td>
        {{ record["name"] }}
    </td>

    <td>
        {{ record["email"] }}
    </td>

    <td>

        <!-- Edit Button -->
        <a
            href="/edit/{{ record['id'] }}"
            class="btn btn-warning btn-sm">

            Edit

        </a>


        <!-- Delete Button -->
        <a
            href="/delete/{{ record['id'] }}"
            class="btn btn-danger btn-sm"
            onclick="return confirm('Are you sure you want to delete this record?');">

            Delete

        </a>

    </td>

</tr>
            {% endfor %}

        </tbody>

    </table>

    {% else %}

    <div class="alert alert-warning mt-4">

        No records found.

    </div>

    {% endif %}


    <div class="mt-3">

        <a href="/" class="btn btn-secondary">
            Back to Home
        </a>

        <a href="/add" class="btn btn-primary">
            Add Record
        </a>

    </div>

</div>

</body>

</html>
