<!DOCTYPE html>
<html>

<head>

    <title>Cleanup Complete</title>

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">

</head>

<body>

<div class="container mt-5">

    <div class="card shadow p-5 text-center">

        <h1>
            Data Cleanup Complete
        </h1>

        <p class="lead mt-3">

            {{ removed_count }} redundant record(s) removed.

        </p>


        {% if removed_count > 0 %}

        <div class="alert alert-success">

            ✅ Duplicate data was successfully cleaned.

        </div>

        {% else %}

        <div class="alert alert-info">

            No redundant records needed to be removed.

        </div>

        {% endif %}


        <div class="mt-3">

            <a href="/"
               class="btn btn-primary">

                Dashboard

            </a>

            <a href="/records"
               class="btn btn-success">

                View Records

            </a>

        </div>

    </div>

</div>

</body>

</html>
